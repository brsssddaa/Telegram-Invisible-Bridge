name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-Bridge-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release and attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "TG-Bridge v1.0.0"
          body: |
            Автономный локальный микро-мост для Telegram без использования системного VPN.
            
            ### Как установить:
            1. Скачайте `app-debug.apk` на телефон.
            2. Установите и откройте приложение **TG-Bridge**.
            3. Убедитесь, что переключатель включен, и нажмите **«ПОДКЛЮЧИТЬ К TELEGRAM В 1 КЛИК»**.
            4. В Telegram нажмите кнопку **«Включить»**.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
